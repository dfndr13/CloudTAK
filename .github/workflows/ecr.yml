name: AWS ECR

on:
  workflow_dispatch:
  # Disabled for the dfndr13 fork: this workflow targets dfpc-coe's own AWS
  # accounts via secrets that GitHub never copies to forks (AWS_ACCOUNT_ID,
  # AWS_REGION, AWS_STAGING_ACCOUNT_ID, AWS_STAGING_REGION), so it fails at
  # the first "Configure AWS Credentials" step on every push/PR. Left as
  # manual-only (workflow_dispatch) rather than deleted so it stays a small,
  # easily-mergeable diff against upstream if this fork ever needs it back.
  # push:
  #   branches:
  #     - main
  # pull_request:
  #   types:
  #     - opened
  #     - synchronize
  #     - reopened
  #     - ready_for_review

permissions:
  id-token: write
  contents: read

jobs:
  build:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        task: [api, pmtiles, events, retention]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{github.event.pull_request.head.sha || github.sha}}

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws-us-gov:iam::${{secrets.AWS_ACCOUNT_ID}}:role/Github-ECR-Builder
          role-session-name: GithubECRBuilder
          aws-region: ${{secrets.AWS_REGION}}

      - name: Docker Build Task (COTAK Production)
        run: npm run build -- ${{matrix.task}}
        env:
          Environment: 'cotak-prod'
          AWS_ACCOUNT_ID: ${{secrets.AWS_ACCOUNT_ID}}
          AWS_REGION: ${{secrets.AWS_REGION}}

      - name: Docker Build Task (WFTAK Production)
        run: npm run build -- ${{matrix.task}}
        env:
          Environment: 'wftak-prod'
          AWS_ACCOUNT_ID: ${{secrets.AWS_ACCOUNT_ID}}
          AWS_REGION: ${{secrets.AWS_REGION}}

      - name: Configure AWS Credentials (STAGING)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::${{secrets.AWS_STAGING_ACCOUNT_ID}}:role/Github-ECR-Builder
          role-session-name: GithubECRBuilder
          aws-region: ${{secrets.AWS_STAGING_REGION}}

      - name: Docker Build Task (COTAK Staging)
        run: npm run build -- ${{matrix.task}}
        env:
          Environment: 'cotak-staging'
          AWS_ACCOUNT_ID: ${{secrets.AWS_STAGING_ACCOUNT_ID}}
          AWS_REGION: ${{secrets.AWS_STAGING_REGION}}

      - name: Docker Build Task (WFTAK Staging)
        run: npm run build -- ${{matrix.task}}
        env:
          Environment: 'wftak-staging'
          AWS_ACCOUNT_ID: ${{secrets.AWS_STAGING_ACCOUNT_ID}}
          AWS_REGION: ${{secrets.AWS_STAGING_REGION}}
